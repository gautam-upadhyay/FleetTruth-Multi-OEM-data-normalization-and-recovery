name: FleetTruth verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: api/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Require the real container integration environment
        run: docker info
      - name: Backend and real broker/database/cache integration tests
        run: mvn -B -f api/pom.xml verify
      - name: Frontend production build and dependency audit
        working-directory: web
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: ML holdout and inference evidence
        run: |
          pip install -r requirements.txt
          python -m pytest ml
          python scripts/collect-evidence.py
      - name: Browser workflows
        run: |
          (cd api && java -jar target/fleettruth-api-1.0.0.jar --server.port=8080 > /tmp/fleettruth-api.log 2>&1) &
          (cd web && npm run dev -- --port 5173 > /tmp/fleettruth-web.log 2>&1) &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8080/actuator/health/readiness && break; sleep 2; done
          cd web
          npm run test:e2e
      - name: Terraform and Helm syntax
        uses: azure/setup-helm@v4.3.0
      - run: helm lint infra/helm/fleettruth
      - uses: hashicorp/setup-terraform@v3
      - run: |
          terraform -chdir=infra/terraform/aws init -backend=false
          terraform -chdir=infra/terraform/aws validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            evidence/
            api/target/surefire-reports/
            api/target/failsafe-reports/
            api/target/cucumber.html
            api/target/pacts/
            api/target/site/jacoco/
            web/playwright-report/
            web/test-results/screenshots/
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SAST
        uses: returntocorp/semgrep-action@v1
        with: {config: 'p/owasp-top-ten'}
      - name: Build runtime images
        run: |
          docker build -t fleettruth-api:ci api
          docker build -t fleettruth-web:ci web
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: 'fleettruth-api:ci', severity: 'HIGH,CRITICAL', exit-code: '1'}
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: 'fleettruth-web:ci', severity: 'HIGH,CRITICAL', exit-code: '1'}
